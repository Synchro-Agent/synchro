name: Uptime synchro.net.nz
# Blueprint A6.4 (chủ sở hữu đồng ý 13/11/2026): máy chủ không tự báo được khi chính nó chết, nên GitHub Actions gọi /api/health từ bên ngoài.
# Lỗi thì job đỏ và GitHub gửi email "Run failed" cho chủ repo (Settings → Notifications → Actions: bật "Send notifications for failed workflows only").
# Không cần secret: /api/health công khai, chỉ trả cờ đúng / sai. Mỗi 5 phút là mức tối thiểu của GitHub; lịch có thể trễ vài phút khi GitHub bận.
# Lưu ý: GitHub tự tắt lịch của repo không có hoạt động (commit) trong 60 ngày; khi đó bật lại ở tab Actions.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Một lần kiểm mỗi lúc: lần trước còn đang thử lại thì lần mới chờ, không chồng nhau.
concurrency:
  group: uptime
  cancel-in-progress: false

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gọi /api/health (thử lại 4 lần, cách nhau 20 giây)
        env:
          URL: https://synchro.net.nz/api/health
        run: |
          # Đạt: HTTP 200, "db": true, và "agent" không phải false (null = máy không bật workspace, vẫn là ổn).
          # Một lần chập chờn (deploy xanh/lam, mạng) không đủ để báo: chỉ báo khi cả 5 lần đều lỗi.
          last=""
          for i in 1 2 3 4 5; do
            body=$(curl -sS -m 20 -A "SynchroUptime/1.0 (+https://github.com/features/actions)" -H "cache-control: no-cache" -w '\n%{http_code}' "$URL" 2>&1) || true
            code=$(printf '%s' "$body" | tail -n1)
            json=$(printf '%s' "$body" | sed '$d')
            db=$(printf '%s' "$json" | jq -r 'if type == "object" then (.db | tostring) else "?" end' 2>/dev/null || echo "?")
            agent=$(printf '%s' "$json" | jq -r 'if type == "object" then (.agent | tostring) else "?" end' 2>/dev/null || echo "?")
            if [ "$code" = 200 ] && [ "$db" = true ] && [ "$agent" != false ]; then
              echo "Ổn (lần $i): HTTP $code, db=$db, agent=$agent, $(printf '%s' "$json" | jq -c '{build, disk}' 2>/dev/null)"
              exit 0
            fi
            last="HTTP ${code:-?}, db=$db, agent=$agent: ${json:0:300}"
            echo "Lần $i chưa đạt: $last"
            [ "$i" -lt 5 ] && sleep 20
          done
          echo "::error title=synchro.net.nz không khỏe::$last"
          exit 1
