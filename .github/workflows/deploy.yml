name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cấu hình SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Đẩy code lên VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            --exclude node_modules --exclude .next --exclude .mkvenv --exclude .cache --exclude .git --exclude '.env*' --exclude /data \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/synchro/

      - name: Build và khởi động lại
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'chown -R synchro:synchro /var/www/synchro && su - synchro -c "cd /var/www/synchro && npm ci && .mkvenv/bin/pip install -q -r requirements.txt && rm -rf .next/cache && NODE_OPTIONS=--max-old-space-size=2048 npx next build && rm -rf .next/server/route-cache && pm2 restart synchro --update-env"'
