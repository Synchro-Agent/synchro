name: Deploy to VPS
# Mỗi lần đẩy code: kiểm tra trước (kiểu, build production, kiểm thử API trên Synchro giả lập), đạt mới deploy.
# Nhánh main → synchro.net.nz. Nhánh staging → staging.synchro.net.nz (dữ liệu riêng, không có khóa model thật).
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

# Lần đẩy mới chỉ hủy bước kiểm tra đang chạy, không bao giờ hủy bước deploy: hủy giữa lúc tráo bản thì web dừng ở trạng thái dở dang.
jobs:
  verify:
    concurrency:
      group: verify-${{ github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # 30 phút không đủ: lần chạy ngày 1/11 bị cắt ở 30 phút 28 giây (blueprint H2.6). Build CI + build bản giả lập + bộ API ≈ 35–45 phút
    # trên máy 2 nhân của GitHub. Bộ giao diện (60–90 phút) KHÔNG nằm ở đây mà ở ui-qa.yml, không chặn deploy (xem chú thích trong tệp đó).
    # Phút Actions (repo riêng tư, gói Free 2.000 phút / tháng): ≈ 40 phút mỗi lần đẩy → khoảng 40 lần đẩy main / staging mỗi tháng.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Cùng bản Node với "engines" trong package.json (22.x) và máy chủ.
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Cài gói
        run: npm ci

      # Dò lỗ hổng gói ở mức cao trở lên (chỉ phụ thuộc production). Advisory: continue-on-error để một CVE mới công bố
      # KHÔNG chặn deploy VPS đang chạy; kết quả nằm trong ci.txt. Bỏ continue-on-error nếu muốn chặn build khi có lỗ hổng cao.
      - name: Dò lỗ hổng gói (npm audit)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee audit.log; exit ${PIPESTATUS[0]}

      - name: Kiểm tra kiểu (TypeScript)
        run: node node_modules/typescript/bin/tsc --noEmit -p . 2>&1 | tee tsc.log; exit ${PIPESTATUS[0]}

      # ESLint (next/core-web-vitals + jsx-a11y, eslint.config.mjs). Gói ESLint chưa cài thì tools/lint.mjs bỏ qua và in lệnh cài.
      # Chưa chặn deploy (continue-on-error) cho tới khi mã cũ hết lỗi lint; kết quả nằm trong ci.txt.
      - name: ESLint
        continue-on-error: true
        run: npm run lint 2>&1 | tee lint.log; exit ${PIPESTATUS[0]}

      # Cùng một lệnh build với package.json và ops/server-build.sh (npm run build = next build).
      - name: Build production
        run: NEXT_DIST_DIR=.next-ci NODE_OPTIONS=--max-old-space-size=4096 npm run build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # Bản build vừa dựng gửi kèm deploy: máy chủ bỏ bước build khi đúng commit, đúng băm package-lock và cùng biến NEXT_PUBLIC_
      # (ops/server-build.sh, from_artifact). Không khớp thì máy chủ tự build như cũ.
      - name: Gói bản build cho máy chủ
        if: github.ref_name == 'main'
        run: |
          mkdir -p synchro-artifact
          tar -czf synchro-artifact/next.tgz --exclude .next-ci/cache .next-ci
          { echo "sha=${{ github.sha }}"
            echo "lock=$(sha1sum package-lock.json | cut -d' ' -f1)"
            echo "pub=$( (env | grep -E '^(NEXT_PUBLIC_[A-Z0-9_]*|APP_URL|SYNCHRO_FIXED_LANG)=' || true) | LC_ALL=C sort | sha1sum | cut -d' ' -f1)"
            echo "dist=.next-ci"
            echo "tgz=$(sha256sum synchro-artifact/next.tgz | cut -d' ' -f1)"; } > synchro-artifact/meta
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'main'
        with:
          name: next-build
          path: synchro-artifact/
          retention-days: 1

      # Synchro giả lập bản production (dev:mock:fast: build một lần rồi next start); chế độ dev biên dịch theo yêu cầu nên bộ kiểm chậm và dễ quá hạn.
      # Lần build thứ hai này cần cùng mức bộ nhớ heap như bước Build production (4096 MB): mặc định của Node trên máy 2 nhân / 7 GB dễ hết bộ nhớ.
      # Không dùng lại .next-ci: bản giả lập dựng với biến riêng (SYNCHRO_FIXED_LANG=vi, APP_URL localhost…), trang dựng sẵn lúc build sẽ lệch.
      - name: Khởi động Synchro giả lập
        id: mock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          nohup npm run dev:mock:fast > mock.log 2>&1 &
          for i in $(seq 1 240); do grep -q "Synchro với API giả lập" mock.log && break; grep -q "Dựng bản chạy nhanh thất bại" mock.log && break; sleep 5; done
          grep -q "Synchro với API giả lập" mock.log || { tail -80 mock.log; exit 1; }

      - name: Kiểm thử API trên Synchro giả lập
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tests/run-all.mjs 2>&1 | tee tests.log; exit ${PIPESTATUS[0]}

      # H2.1: bộ giao diện (tools/qa.mjs, Chrome ẩn) chạy ở workflow riêng .github/workflows/ui-qa.yml: chưa từng có một lần xanh trên CI và tốn
      # 60–90 phút, nên chưa được chặn deploy. Khi đã có một lần chạy xanh trọn vẹn, chuyển bước đó về đây (sau bộ API) để nó chặn deploy.

      # Repo riêng tư: kết quả kiểm tra được xem bằng SSH trên VPS, kể cả khi lỗi. Job này đã chạy mã của gói npm (npm ci, dev:mock) nên không được chạm khóa SSH: chỉ gói kết quả, job report gửi đi.
      - name: Gói kết quả kiểm tra
        if: always()
        run: |
          { echo "commit ${{ github.sha }} · ${{ job.status }} · $(date -u '+%Y-%m-%d %H:%M UTC')"
            [ -f tests.log ] && { echo; echo "━━ Các kiểm tra lỗi"; grep -n -B1 "✗" tests.log | cut -c1-600; }
            for f in tsc.log lint.log build.log tests.log mock.log audit.log; do [ -f $f ] && { echo; echo "━━ $f"; tail -150 $f; }; done; } > ci.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result
          path: ci.txt
          retention-days: 1

  # Máy chạy riêng, không checkout, không cài gói nào: gói npm bị chiếm ở job verify không đợi được khóa này.
  report:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ci-result
      - name: Gửi kết quả kiểm tra lên VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # VPS_KNOWN_HOSTS (dòng known_hosts của máy chủ): có thì dùng, khỏi tin máy trả lời ssh-keyscan lần đầu.
          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts; else ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null; fi
          scp -i ~/.ssh/id_deploy ci.txt ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/ci-status/${{ github.ref_name }}.txt || true

  # Gộp deploy: lần deploy đạt gần nhất (máy chủ ghi /var/lib/synchro-ops/last-deploy-synchro) chưa đủ 15 phút thì chờ cho đủ. Lần đẩy mới
  # trong lúc chờ hủy lần đang chờ (cancel-in-progress), nên nhiều lần đẩy liền nhau thành một lần deploy của commit mới nhất.
  coalesce:
    needs: verify
    if: github.ref_name == 'main'
    concurrency:
      group: deploy-wait-${{ github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Chờ đủ 15 phút từ lần deploy trước
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts; else ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null; fi
          last=$(ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'cat /var/lib/synchro-ops/last-deploy-synchro 2>/dev/null || echo 0' | tr -dc 0-9)
          wait=$(( 900 - ($(date +%s) - ${last:-0}) ))
          if [ "$wait" -gt 0 ]; then echo "Lần deploy trước cách đây chưa tới 15 phút: chờ $wait giây (lần đẩy mới sẽ thay lần này)."; sleep "$wait"; fi

  # Chỉ hàng đợi một lần: GitHub giữ tối đa một lần chờ trong nhóm, lần mới hơn thay lần cũ hơn. Không bao giờ hủy lần đang deploy.
  deploy:
    needs: [verify, coalesce]
    if: github.ref_name == 'main'
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: next-build
          path: .synchro-artifact

      - name: Cấu hình SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts; else ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts; fi

      # Vào thư mục incoming, không vào thẳng thư mục app: web đang chạy không thấy mã mới tới khi bản mới đã build xong và được bật
      # (server-build.sh chép public, db, catalog, scripts, workspace… cùng lúc với bản build).
      - name: Đẩy code lên VPS
        run: |
          echo "${{ github.sha }}" > .synchro-source-sha
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            --exclude node_modules --exclude .next --exclude '.next-*' --exclude .mkvenv --exclude .cache --exclude .git --exclude '.env*' --exclude /data \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/synchro-incoming/

      - name: Build và chuyển bản
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'nohup bash -c "SYNCHRO_INCOMING=/var/www/synchro-incoming bash /var/www/synchro-incoming/ops/server-build.sh /var/www/synchro synchro pip && bash /var/www/synchro/ops/setup.sh" > /var/log/synchro-deploy.log 2>&1 & p=$!; tail -n +1 --pid=$p -f /var/log/synchro-deploy.log & t=$!; wait $p; c=$?; sleep 1; kill $t 2>/dev/null; exit $c'

  deploy-staging:
    needs: verify
    if: github.ref_name == 'staging'
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cấu hình SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts; else ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts; fi

      - name: Đẩy code lên staging
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            --exclude node_modules --exclude .next --exclude '.next-*' --exclude .mkvenv --exclude .cache --exclude .git --exclude '.env*' --exclude /data \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/synchro-staging/

      - name: Build và khởi động lại staging
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'bash /var/www/synchro-staging/ops/server-build.sh /var/www/synchro-staging synchro-staging'
