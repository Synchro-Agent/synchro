# Dependabot: tự mở PR cập nhật gói npm và GitHub Actions có lỗ hổng / lỗi thời.
# Gom theo nhóm để không tràn PR; chỉ phụ thuộc production là ưu tiên bảo mật.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
